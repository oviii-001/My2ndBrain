name = "sidecar-cloud-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[vars]
WAKE_WORD = "jarvis"
HF_SPACE_URL = "https://ekc4-jarvis-tts.hf.space"
TTS_SPEAKER = "angus" # Deepgram Aura: "angus" (British/Irish natural male), "orion" (deep calm male)

# Hugging Face Spaces 24/7 Keep-Alive Cron (Prevents the 48-hour sleep trigger)
[triggers]
crons = ["0 0 * * *"] # Every 24 hours

# 24/7 Meta Muse AI Bridge Endpoint (when deployed to free cloud container or local tunnel):
# Set via: npx wrangler secret put MUSE_BRIDGE_URL

# Optional Hugging Face Free Space Endpoint & Token:
# Set via: npx wrangler secret put HF_SPACE_URL
# Set via: npx wrangler secret put HF_TOKEN
