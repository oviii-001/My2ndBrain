[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.6.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -O2
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/pschatzmann/ESP32-A2DP.git
